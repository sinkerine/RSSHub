repos:
    - repo: local
      hooks:
          - id: format-description
            name: format-description
            entry: bash scripts/run-hook.sh small pnpm exec tsx scripts/workflow/format-description.ts
            language: system
            files: \.(ts|tsx|js|cjs|mjs)$
          - id: oxlint
            name: oxlint
            entry: bash scripts/run-hook.sh medium pnpm exec oxlint --threads=2 --type-aware --fix
            language: system
            files: \.(ts|tsx|js|cjs|mjs)$
          - id: eslint
            name: eslint
            entry: bash scripts/run-hook.sh medium pnpm exec eslint --cache --fix --concurrency 2
            language: system
            files: \.(ts|tsx|js|cjs|mjs|ya?ml)$
          - id: oxfmt
            name: oxfmt
            entry: bash scripts/run-hook.sh small pnpm exec oxfmt --threads=1 --no-error-on-unmatched-pattern
            language: system
          - id: typecheck
            name: typecheck
            entry: bash scripts/run-hook.sh medium pnpm typecheck
            language: system
            pass_filenames: false
            always_run: true
